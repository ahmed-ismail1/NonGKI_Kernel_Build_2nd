name: Build Samsung Galaxy M11 (A11Q) KSU Next + SUSFS (Kernel 4.9)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device Information
  DEVICE_NAME : "galaxy_m11"
  DEVICE_CODENAME : "a11q"

  # Build Commands
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=0"

  # Kernel Source
  KERNEL_SOURCE : "https://github.com/ifoodplayer/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH : "lineage-20"

  # Clang Toolchain
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  # GCC Toolchain
  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  # Defconfig
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "next"

  # SUSFS
  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  # AnyKernel3
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  # Boot Image
  BOOT_SOURCE : ""

  # DTBO
  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  # ROM Information
  ROM_TEXT : "lineage20_a11q_ksunext_susfs"

  # Python Version
  PYTHON_VERSION: "2"

  # Packaging
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  # KernelSU Method
  KERNELSU_METHOD: "shell"

  # Patch Sources
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  # SUSFS Patches
  SUSFS_FOLDER_FIXED: "redmi_8_419"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  # Re:Kernel
  REKERNEL_ENABLE: "true"

  # Hook Method
  HOOK_METHOD: "manual"

  # Kernel Patch (Important for 4.9)
  KERNEL_PATCH: "true"

  # KPM
  KPM_ENABLE: "true"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"

  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  # Baseband Guard
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # Hide Features
  HIDE_STUFF: "true"

  # DTB Generation
  GENERATE_DTB: "false"
  GENERATE_CHIP: "msm8953"

  # Build Debugging
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "true"

  # Merge Config
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  # Free Space
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Samsung Galaxy M11 (A11Q) Kernel Build
    runs-on: ubuntu-latest
    container: ubuntu:focal

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🔓 Set SELinux Permissive
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: 🪛 Samsung 4.9 Fixes
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          sed -i 's/check_defconfig//' scripts/kconfig/Makefile || true
          sed -i 's/-Werror//g' Makefile || true
          sed -i 's/CONFIG_LTO=y/# CONFIG_LTO is not set/g' arch/arm64/configs/${{ env.DEFCONFIG_NAME }} || true

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 📦 Prepare AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE

          git clone --depth=1 ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} AnyKernel3

      - name: 📁 Copy Image
        run: |
          cd $GITHUB_WORKSPACE

          cp device_kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb || true
          cp device_kernel/out/arch/arm64/boot/Image AnyKernel3/Image || true

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
