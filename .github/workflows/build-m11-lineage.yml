name: Build Samsung Galaxy M11 (LineageOS 20) + KSU

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME    : "galaxy_m11"
  DEVICE_CODENAME: "a11q"

  KERNEL_SOURCE: "https://github.com/ifoodplayer/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH: "lineage-20"

  DEFCONFIG_SOURCE      : ""
  DEFCONFIG_NAME        : "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT   : false

  CLANG_SOURCE: "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH: "master"

  CUSTOM_CMDS: "CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
  EXTRA_CMDS : "CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  GCC_GNU      : true
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  KERNELSU_SOURCE   : ""
  KERNELSU_BRANCH   : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK: "resukisu"

  SUSFS_ENABLE      : false
  SUSFS_FIXED       : false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED : ""

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE: ""

  NEED_DTBO      : false
  NEED_SAFE_DTBO : false
  ROM_TEXT       : "lineage20"
  PACK_METHOD    : "Anykernel3"
  PACK_KMODULES  : "false"
  KERNELSU_METHOD: "shell"

  REKERNEL_ENABLE: "false"

  HOOK_METHOD : "syscall"
  KERNEL_PATCH: "true"

  KPM_ENABLE      : "false"
  KPM_INLINE      : "false"
  KPM_KPATCH_NEXT : "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT  : "false"
  HIDE_STUFF           : "true"

  GENERATE_DTB  : "false"
  GENERATE_CHIP : "qcom"

  BUILD_DEBUGGER    : "false"
  SKIP_PATCH        : "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""
  FREE_MORE_SPACE   : "false"

  PYTHON_VERSION: "3"

jobs:
  build-kernel:
    name: Samsung Galaxy M11 (LineageOS 20)
    runs-on: ubuntu-latest
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK : "true"

    steps:
      - name: 🛠️ Setup container (install sudo)
        run: |
          apt-get update -y
          apt-get install -y sudo

      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
