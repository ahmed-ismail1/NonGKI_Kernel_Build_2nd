name: Build Samsung Galaxy M11 (LineageOS 20)

on:
  workflow_dispatch:

env:
  DEVICE_NAME : "galaxy_m11"
  DEVICE_CODENAME : "a11q"

  KERNEL_SOURCE : "https://github.com/ifoodplayer/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH : "lineage-20"

  # Use GCC instead of Clang for older kernel
  CLANG_SOURCE : ""
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_arm-eabi.git"
  GCC_32_BRANCH : "main"

  DEFCONFIG_NAME : "a11q_open_defconfig"
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage_20"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "samsung_kernel"

  SUSFS_FOLDER_FIXED: ""  # Leave empty - will try auto-detect
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "true"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "true"
  KPM_ENABLE: "true"
  KPM_INLINE: "false"  # Changed to false for stability
  KPM_KPATCH_NEXT: "false"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "true"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "msm8953"  # SDM450 chipset

  BUILD_DEBUGGER: "true"  # Enable for debugging
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"

  FREE_MORE_SPACE: "true"  # Enable to avoid space issues

jobs:
  build-kernel:
    name: Samsung Galaxy M11 (LineageOS 20)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🛠️ Fix KPM features
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Remove existing configs if they exist
          sed -i '/CONFIG_DEBUG_KERNEL/d' arch/arm64/configs/a11q_open_defconfig
          sed -i '/CONFIG_KALLSYMS/d' arch/arm64/configs/a11q_open_defconfig
          sed -i '/CONFIG_KALLSYMS_ALL/d' arch/arm64/configs/a11q_open_defconfig
          sed -i '/CONFIG_HAVE_KPROBES/d' arch/arm64/configs/a11q_open_defconfig
          
          # Add required configs
          cat <<EOF >> arch/arm64/configs/a11q_open_defconfig
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_HAVE_KPROBES=y
          EOF
          echo "[+] Fixed KPM and Kprobe features"

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔍 Verify and Create DTBO Image
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "🔍 Searching for dtb/dtbo files..."
          # Create dtbo directory
          mkdir -p out/arch/arm64/boot/dtbo
          
          # Try multiple patterns
          DTBO_FILES=$(find out/arch/arm64/boot/dts -name "*.dtbo" 2>/dev/null || echo "")
          
          if [ -z "$DTBO_FILES" ]; then
            # Alternative: use dtb files
            DTB_FILES=$(find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -5)
            if [ -n "$DTB_FILES" ]; then
              echo "📦 Found dtb files, creating dtbo.img from them..."
              cat $DTB_FILES > out/arch/arm64/boot/dtbo.img
              echo "✅ Created dtbo.img from dtb files"
            else
              echo "⚠️ No dtbo/dtb files found - this might be OK for some devices"
            fi
          else
            echo "📦 Creating dtbo.img..."
            ./tools/mkdtimg create out/arch/arm64/boot/dtbo.img --page_size=4096 ${DTBO_FILES}
            if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              echo "✅ DTBO created successfully"
            else
              echo "❌ DTBO creation failed"
              exit 1
            fi
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
