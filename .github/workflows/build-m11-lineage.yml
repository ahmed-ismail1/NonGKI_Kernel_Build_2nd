name: Build Samsung Galaxy M11 (LineageOS 20) + KSU

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME    : "galaxy_m11"
  DEVICE_CODENAME: "a11q"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
  EXTRA_CMDS : "CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE: "https://github.com/ifoodplayer/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH: "lineage-20"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU      : true
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE      : ""
  DEFCONFIG_NAME        : "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT   : false

  KERNELSU_SOURCE   : ""
  KERNELSU_BRANCH   : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK: "rsuntk"

  SUSFS_ENABLE: false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE: ""

  NEED_DTBO     : false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lineage20"

  PYTHON_VERSION: "3"

  PACK_METHOD    : "Anykernel3"
  KERNELSU_METHOD: ""

  PATCHES_SOURCE    : ""
  PATCHES_BRANCH    : ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED : ""

  REKERNEL_ENABLE: ""

  HOOK_METHOD: "syscall"
  HOOK_OLDER : "false"

  KERNEL_PATCH: "true"

  KPM_ENABLE      : "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT  : "false"

  HIDE_STUFF: "false"

  GENERATE_DTB  : "false"
  GENERATE_CHIP : "qcom"

  BUILD_DEBUGGER    : "true"
  SKIP_PATCH        : "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Samsung Galaxy M11 (LineageOS 20)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK : "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Disable vDSO32 — LLVM ld doesn't support ARM32 emulation
          sed -i '/CONFIG_VDSO32/d' arch/arm64/configs/a11q_open_defconfig
          echo "CONFIG_VDSO32=n" >> arch/arm64/configs/a11q_open_defconfig
          echo "[+] vDSO32 disabled"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
