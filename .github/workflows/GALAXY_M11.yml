name: Build Samsung Galaxy M11+ KSUn+susfs

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "galaxy_m11"
  DEVICE_CODENAME: "a11q"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
  EXTRA_CMDS: "CC=clang AR=llvm-ar NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE: "https://github.com/ahmed-ismail1/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH: "lineage-20"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: true
  GCC_64_SOURCE: "https://github.com/mvaisakh/gcc-arm64/archive/refs/heads/gcc-master.zip"
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: "https://github.com/mvaisakh/gcc-arm/archive/refs/heads/gcc-master.zip"
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: false
  KERNELSU_AUTO_FORK: ""

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lineage20"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "none"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"
  SUSFS_FOLDER_FIXED: "Patches/Patch"
  SUSFS_PATCH_FIXED: "susfs_patch_to_4.9"

  REKERNEL_ENABLE: ""

  HOOK_METHOD: "syscall"
  HOOK_OLDER: "true"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true" 
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"   

jobs:
  build-kernel:
    name: Samsung Galaxy M11 (LineageOS 20)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔍 Verify SUSFS Patch Application
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "==============================================="
          echo "[*] SUSFS Patch Verification Step"
          echo "==============================================="
          
          # Check fs/namespace.c
          if grep -q "susfs_is_mnt_dev_hidden" fs/namespace.c; then
              echo "✅ SUSFS patch applied to fs/namespace.c"
          else
              echo "❌ ERROR: SUSFS patch NOT applied to fs/namespace.c"
              echo "[*] Checking for any SUSFS references..."
              grep -n "susfs" fs/namespace.c | head -20 || echo "No SUSFS references found"
              exit 1
          fi
          
          # Check fs/proc/task_mmu.c
          if grep -q "susfs_open_redirect_spoof_show_map_vma" fs/proc/task_mmu.c; then
              echo "✅ SUSFS patch applied to fs/proc/task_mmu.c"
          else
              echo "❌ ERROR: SUSFS patch NOT applied to fs/proc/task_mmu.c"
              echo "[*] Checking for any SUSFS references..."
              grep -n "susfs" fs/proc/task_mmu.c | head -20 || echo "No SUSFS references found"
              exit 1
          fi
          
          echo "✅ All SUSFS patches verified successfully!"
          echo "==============================================="

      - name: 🪛 Complete KernelSU & SUSFS Integration
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "==============================================="
          echo "[*] KernelSU & SUSFS Build System Integration"
          echo "==============================================="
          
          # Step 1: Clean old files
          echo "[+] Step 1: Cleaning up old KSU files..."
          rm -rf KernelSU drivers/kernelsu
          
          # Step 2: Clone KernelSU-Next with SUSFS support
          echo "[+] Step 2: Cloning KernelSU-Next with SUSFS support..."
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy-susfs drivers/kernelsu || {
              echo "❌ Failed to clone KernelSU-Next"
              exit 1
          }
          
          # Verify KernelSU structure
          if [ ! -f "drivers/kernelsu/kernel/core.c" ]; then
              echo "❌ ERROR: KernelSU source structure invalid"
              exit 1
          fi
          echo "✅ KernelSU cloned successfully"
          
          # Step 3: Link KernelSU to kernel build system (Kbuild)
          echo "[+] Step 3: Integrating KernelSU into Kbuild..."
          
          # Add to drivers/Makefile
          if ! grep -q "obj-\$(CONFIG_KSU)" drivers/Makefile; then
              echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
              echo "✅ Added to drivers/Makefile"
          else
              echo "⚠️  KernelSU already in drivers/Makefile"
          fi
          
          # Add to drivers/Kconfig
          if ! grep -q "source.*drivers/kernelsu/Kconfig" drivers/Kconfig; then
              sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
              echo "✅ Added to drivers/Kconfig"
          else
              echo "⚠️  KernelSU Kconfig already linked"
          fi
          
          # Step 4: Ensure SUSFS symbols are properly exposed
          echo "[+] Step 4: Verifying SUSFS symbol exposure..."
          
          # Check if SUSFS functions are properly exported
          if grep -q "EXPORT_SYMBOL.*susfs_is_mnt_dev_hidden" drivers/kernelsu/kernel/susfs.c 2>/dev/null || \
             grep -q "extern.*susfs_is_mnt_dev_hidden" fs/namespace.c; then
              echo "✅ SUSFS symbols properly exposed"
          else
              echo "⚠️  Note: Checking SUSFS symbol linkage during build phase"
          fi
          
          # Step 5: Update defconfig with comprehensive SUSFS & KSU options
          echo "[+] Step 5: Updating defconfig with all required options..."
          
          # Backup original defconfig
          cp arch/arm64/configs/${{ env.DEFCONFIG_NAME }} arch/arm64/configs/${{ env.DEFCONFIG_NAME }}.backup
          
          # Add all required kernel configuration options
          cat <<'DEFCONFIG' >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          
          # KernelSU Core Configuration
            CONFIG_KSU=y
            CONFIG_KSU_MANUAL_HOOK=y
            CONFIG_KSU_NONE_HOOK=n
            CONFIG_KPROBES=y
            CONFIG_HAVE_SYSCALL_TRACEPOINTS=y

          # KernelSU + SUSFS Integration
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_ALGO=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_SU=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SUS_MAP=y

            # Security Disable (Samsung specifics)
            # CONFIG_SECURITY_DEFKNOT is not set
            # CONFIG_KNOX_KAP is not set
            # CONFIG_SEC_RESTRICT is not set
         
            DEFCONFIG
          
          echo "✅ Defconfig updated with all options"
          
          # Step 6: Final verification
          echo "[+] Step 6: Final verification..."
          
          ERRORS=0
          
          # Verify Makefile linkage
          if grep -q "obj-\$(CONFIG_KSU)" drivers/Makefile; then
              echo "✅ KernelSU linked to Makefile"
          else
              echo "❌ KernelSU NOT linked to Makefile"
              ERRORS=$((ERRORS + 1))
          fi
          
          # Verify Kconfig linkage
          if grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
              echo "✅ KernelSU Kconfig linked"
          else
              echo "❌ KernelSU Kconfig NOT linked"
              ERRORS=$((ERRORS + 1))
          fi
          
          # Verify SUSFS functions patched
          if grep -q "susfs_is_mnt_dev_hidden" fs/namespace.c; then
              echo "✅ SUSFS namespace.c patched"
          else
              echo "❌ SUSFS namespace.c NOT patched"
              ERRORS=$((ERRORS + 1))
          fi
          
          if grep -q "susfs_open_redirect_spoof_show_map_vma" fs/proc/task_mmu.c; then
              echo "✅ SUSFS task_mmu.c patched"
          else
              echo "❌ SUSFS task_mmu.c NOT patched"
              ERRORS=$((ERRORS + 1))
          fi
          
          # Verify defconfig
          if grep -q "CONFIG_KSU=y" arch/arm64/configs/${{ env.DEFCONFIG_NAME }}; then
              echo "✅ CONFIG_KSU=y enabled"
          else
              echo "❌ CONFIG_KSU=y NOT enabled"
              ERRORS=$((ERRORS + 1))
          fi
          
          if grep -q "CONFIG_KSU_SUSFS=y" arch/arm64/configs/${{ env.DEFCONFIG_NAME }}; then
              echo "✅ CONFIG_KSU_SUSFS=y enabled"
          else
              echo "❌ CONFIG_KSU_SUSFS=y NOT enabled"
              ERRORS=$((ERRORS + 1))
          fi
          
          echo "==============================================="
          
          if [ $ERRORS -eq 0 ]; then
              echo "✅ All integration checks passed!"
              echo "Ready for kernel build..."
          else
              echo "❌ Integration checks failed! ($ERRORS errors)"
              exit 1
          fi
          
          echo "==============================================="   
          - name: 🚀 Build Process
            uses: ./.github/workflows/build-process  
        
          - name: 🔩 Pack Process
            uses: ./.github/workflows/pack-process

          - name: ✏️ Upload Artifacts
            uses: ./.github/workflows/upload-files
