name: Build M11_A11

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "galaxy_m11"
  DEVICE_CODENAME: "a11q"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
  EXTRA_CMDS: "CC=clang AR=llvm-ar NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE: "https://github.com/ahmed-ismail1/android_kernel_samsung_sdm450.git"
  KERNEL_BRANCH: "lineage-20"

  CLANG_SOURCE: "https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: true
  GCC_64_SOURCE: "https://github.com/mvaisakh/gcc-arm64/archive/refs/heads/gcc-master.zip"
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: "https://github.com/mvaisakh/gcc-arm/archive/refs/heads/gcc-master.zip"
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "a11q_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "resukisu"

  SUSFS_ENABLE: true
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "lineage20"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Samsung Galaxy M11 LineageOS 20
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: M11 SUSFS partial compatibility fix
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          echo "====== M11 SUSFS partial compatibility fix ======"

          echo "[*] Cleanup .rej and .orig files"
          find . -type f -name "*.rej" -print -delete || true
          find . -type f -name "*.orig" -print -delete || true

          DEFCONFIG="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          echo "[*] Add SUSFS namespace include block if missing"

          if ! grep -q "linux/susfs_def.h" fs/namespace.c; then
            {
              echo "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
              echo "#include <linux/susfs_def.h>"
              echo "#endif"
            } > /tmp/susfs_include_block.txt

            awk '
              NR==FNR {
                block = block $0 ORS
                next
              }
              /#include <linux\/task_work.h>/ && done == 0 {
                print
                printf "%s", block
                done = 1
                next
              }
              {
                print
              }
            ' /tmp/susfs_include_block.txt fs/namespace.c > /tmp/namespace.c.new

            mv /tmp/namespace.c.new fs/namespace.c
          fi

          echo "[*] Add SUSFS namespace extern block if missing"

          if ! grep -q "susfs_is_current_ksu_domain" fs/namespace.c; then
            {
              echo ""
              echo "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT"
              echo "extern bool susfs_is_current_ksu_domain(void);"
              echo "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;"
              echo ""
              echo "#ifndef CL_COPY_MNT_NS"
              echo "#define CL_COPY_MNT_NS BIT(25)"
              echo "#endif"
              echo ""
              echo "#endif"
              echo ""
            } > /tmp/susfs_extern_block.txt

            awk '
              NR==FNR {
                block = block $0 ORS
                next
              }
              /#include "internal.h"/ && done == 0 {
                print
                printf "%s", block
                done = 1
                next
              }
              {
                print
              }
            ' /tmp/susfs_extern_block.txt fs/namespace.c > /tmp/namespace.c.new

            mv /tmp/namespace.c.new fs/namespace.c
          fi

          echo "[*] Disable SUSFS features that failed on M11"

          sed -i '/CONFIG_KSU_SUSFS_SUS_KSTAT/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_SUSFS_OPEN_REDIRECT/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_SUSFS_SUS_MAP/d' "$DEFCONFIG" || true

          echo "# CONFIG_KSU_SUSFS_SUS_KSTAT is not set" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_SUSFS_SUS_MAP is not set" >> "$DEFCONFIG"

          echo "[*] Keep SUSFS core features enabled"

          grep -q "^CONFIG_KSU_SUSFS=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU_SUSFS_SUS_PATH=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU_SUSFS_SUS_MOUNT=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU_SUSFS_ENABLE_LOG=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
          grep -q "^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" "$DEFCONFIG" || echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"

          echo "====== Verify SUSFS files ======"
          ls -lah fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h || true

          echo "====== Verify susfs_is_mnt_dev_hidden ======"
          grep -R "susfs_is_mnt_dev_hidden" fs/ include/linux/ || true

          echo "====== Verify namespace SUSFS refs ======"
          grep -n "susfs\|CL_COPY_MNT_NS" fs/namespace.c || true

          echo "====== Final SUSFS defconfig state ======"
          grep -n "KSU_SUSFS" "$DEFCONFIG" || true

      - name: Debug SUSFS after patch
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          echo "====== Kernel version ======"
          make kernelversion || true

          echo "====== Check fs/susfs.c ======"
          ls -lah fs/susfs.c || true

          echo "====== Check susfs_is_mnt_dev_hidden ======"
          grep -R "susfs_is_mnt_dev_hidden" fs/ || true

          echo "====== Check SUSFS refs in namespace.c ======"
          grep -n "susfs" fs/namespace.c || true

          echo "====== Check remaining .rej files ======"
          find . -type f -name "*.rej" -print || true

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          DEFCONFIG="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$DEFCONFIG"

          echo "====== Final KSU/SUSFS defconfig entries ======"
          grep -n "KSU\|SUSFS" "$DEFCONFIG" || true

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
